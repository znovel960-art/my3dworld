<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My3DWorld</title>
<style>
:root{--p:#241c2c;--line:#ffffff22;--a:#b98cff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#17131b;color:#fff;font-family:system-ui,Arial}#game{position:fixed;inset:0;width:100%;height:100%}.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;background:#201a28e8;border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 10px 30px #0004}.btn,input{font:inherit;color:#fff;background:#2c2435;border:1px solid #ffffff22;border-radius:10px;padding:10px}.btn{cursor:pointer}.primary{background:var(--a);color:#17121d;font-weight:700}
#auth{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 28px));padding:24px}#auth input,#auth .btn{width:100%;margin-top:8px}
#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}.card{padding:10px 13px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions .btn{padding:9px 11px}
#chat{position:absolute;right:14px;bottom:14px;width:min(350px,calc(100% - 28px));padding:12px}#messages{height:160px;overflow:auto;margin:8px 0}.msg{font-size:13px;padding:6px 0;border-bottom:1px solid #fff1}#chatForm{display:flex;gap:6px}#chatForm input{flex:1;min-width:0}#chatForm .btn{width:70px}
.modal{position:absolute;left:14px;bottom:14px;width:min(420px,calc(100% - 28px));max-height:70%;overflow:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{padding:9px;text-align:center;background:#2a2231;border:1px solid #fff1;border-radius:12px}.item .btn{width:100%;margin-top:6px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0}.row .btn{width:45px}.friend{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #fff1}.friend .btn{width:auto;padding:7px}
.muted{color:#c5b9c8;font-size:12px}@media(max-width:650px){#top{flex-direction:column}.modal{bottom:205px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><canvas id="game"></canvas><div id="hud">
<div id="auth" class="panel"><h1>✨ My3DWorld</h1><p class="muted">3D fashion • home • friends • chat</p><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password (8+ characters)"><button id="loginBtn" class="btn primary">Login</button><button id="registerBtn" class="btn">Create account</button><p id="authStatus" class="muted"></p></div>
<div id="app" class="hidden"><div id="top"><div class="panel card">👤 <b id="playerName"></b> · Lv <b id="level">1</b> · 🪙 <b id="coins">1000</b> · 💎 <b id="gems">100</b></div><div class="actions"><button class="btn" id="wardrobeBtn">👗 Wardrobe</button><button class="btn" id="shopBtn">🛍️ Shop</button><button class="btn" id="furnitureBtn">🪑 Room</button><button class="btn" id="friendsBtn">👥 Friends</button><button class="btn" id="profileBtn">👤 Profile</button></div></div>
<div id="wardrobe" class="panel modal hidden"><h3>👗 Wardrobe</h3><p class="muted">Try your owned looks.</p><div id="wardrobeGrid" class="grid"></div></div>
<div id="shop" class="panel modal hidden"><h3>🛍️ Shop</h3><div id="shopGrid" class="grid"></div></div>
<div id="furniture" class="panel modal hidden"><h3>🪑 Furniture</h3><p class="muted">Drag a card onto the 3D room. Double-click placed furniture to remove it.</p><div id="furnitureGrid" class="grid"></div></div>
<div id="friends" class="panel modal hidden"><h3>👥 Friends</h3><button class="btn primary" id="addFriend" style="width:100%">＋ Add Friend</button><div id="friendList"></div></div>
<div id="profile" class="panel modal hidden"><h3>👤 Profile</h3><div id="profileBody"></div><button class="btn" id="editProfile" style="width:100%;margin-top:8px">Edit bio</button></div>
<div id="chat" class="panel"><b>💬 Room Chat</b><div id="messages"></div><form id="chatForm"><input id="chatInput" maxlength="500" placeholder="Chat with players…"><button class="btn">Send</button></form></div></div></div>
<script type="module" src="./src/main.js"></script></body></html>
